name: release-win

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $env:QT_NEXT_DIST_DIR = '.next-build'
          npx next build
          node scripts/prepare-standalone.cjs
          node scripts/prepare-win-icon.cjs
          npm run build:native-core

          $maxAttempts = 3
          $buildSucceeded = $false
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Build attempt $attempt/$maxAttempts"
            $attemptOutput = "dist-attempt-$attempt"

            # Isolate each attempt output to avoid reusing locked win-unpacked files.
            if (Test-Path -LiteralPath $attemptOutput) {
              Remove-Item -LiteralPath $attemptOutput -Recurse -Force -ErrorAction SilentlyContinue
            }

            npx electron-builder --win nsis --config.directories.output=$attemptOutput
            if ($LASTEXITCODE -eq 0) {
              Remove-Item -LiteralPath 'dist' -Recurse -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Path 'dist' -Force | Out-Null
              Copy-Item -Path (Join-Path $attemptOutput '*') -Destination 'dist' -Recurse -Force
              $buildSucceeded = $true
              break
            }

            Start-Sleep -Seconds (10 * $attempt)
          }

          if (-not $buildSucceeded) {
            throw "Installer build failed after $maxAttempts attempts."
          }

      - name: Build launcher zip + latest.json
        shell: pwsh
        run: |
          $baseUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/"
          & ./scripts/build-launcher-release.ps1 -BaseUrl $baseUrl

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/QuickText-Setup-*.exe
            dist/QuickText-win-x64.zip
            dist/latest.json
