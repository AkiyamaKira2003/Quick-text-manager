name: release-win

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      DIST_ROOT: dist-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $env:QT_NEXT_DIST_DIR = '.next-build'
          npx next build
          node scripts/prepare-standalone.cjs
          node scripts/prepare-win-icon.cjs
          npm run build:native-core

          $maxAttempts = 3
          $buildSucceeded = $false
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Build attempt $attempt/$maxAttempts"
            $attemptOutput = "${{ env.DIST_ROOT }}-attempt-$attempt"

            # Isolate each attempt output to avoid reusing locked win-unpacked files.
            if (Test-Path -LiteralPath $attemptOutput) {
              Remove-Item -LiteralPath $attemptOutput -Recurse -Force -ErrorAction SilentlyContinue
            }

            npx electron-builder --win nsis --config.directories.output=$attemptOutput
            if ($LASTEXITCODE -eq 0) {
              "DIST_ROOT=$attemptOutput" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              $buildSucceeded = $true
              break
            }

            Start-Sleep -Seconds (10 * $attempt)
          }

          if (-not $buildSucceeded) {
            throw "Installer build failed after $maxAttempts attempts."
          }

      - name: Build launcher zip + latest.json
        shell: pwsh
        run: |
          $baseUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/"
          & ./scripts/build-launcher-release.ps1 -BaseUrl $baseUrl -DistRoot "${{ env.DIST_ROOT }}"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.DIST_ROOT }}/QuickText-Setup-*.exe
            ${{ env.DIST_ROOT }}/QuickText-win-x64.zip
            ${{ env.DIST_ROOT }}/latest.json
