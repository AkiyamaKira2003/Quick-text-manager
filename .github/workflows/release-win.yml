name: release-win

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: npm install

      - name: Install Python bundle dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt pyinstaller

      - name: Build Windows unpacked app
        shell: pwsh
        env:
          QT_SKIP_PYTHON_BUNDLE_INSTALL: '1'
        run: |
          $ErrorActionPreference = 'Stop'

          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Unpacked build attempt $attempt/$maxAttempts"

            if (Test-Path -LiteralPath 'dist/win-unpacked') {
              Remove-Item -LiteralPath 'dist/win-unpacked' -Recurse -Force -ErrorAction SilentlyContinue
            }

            npm run dist:folder
            if ($LASTEXITCODE -eq 0) {
              break
            }

            if ($attempt -eq $maxAttempts) {
              throw "dist:folder failed after $maxAttempts attempts."
            }

            Start-Sleep -Seconds (10 * $attempt)
          }

      - name: Build Windows setup installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $sourceUnpacked = 'dist/win-unpacked'
          if (-not (Test-Path -LiteralPath $sourceUnpacked)) {
            throw "Missing $sourceUnpacked. Unpacked build step must complete first."
          }

          $maxAttempts = 3
          $buildSucceeded = $false
          $lastFailure = ''
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Installer build attempt $attempt/$maxAttempts"
            $attemptOutput = "dist-installer-attempt-$attempt"
            $attemptSource = "dist-installer-source-$attempt"

            if (Test-Path -LiteralPath $attemptOutput) {
              Remove-Item -LiteralPath $attemptOutput -Recurse -Force -ErrorAction SilentlyContinue
            }
            if (Test-Path -LiteralPath $attemptSource) {
              Remove-Item -LiteralPath $attemptSource -Recurse -Force -ErrorAction SilentlyContinue
            }

            try {
              New-Item -ItemType Directory -Path $attemptSource -Force | Out-Null
              Copy-Item -Path (Join-Path $sourceUnpacked '*') -Destination $attemptSource -Recurse -Force
            } catch {
              $copyError = $_.Exception.Message
              $lastFailure = "copy-failed: $copyError"
              $escapedCopyError = $lastFailure.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::warning::Installer attempt $attempt copy prepackaged source failed: $escapedCopyError"
              Start-Sleep -Seconds (10 * $attempt)
              continue
            }

            $attemptLogs = New-Object System.Collections.Generic.List[string]
            & npx electron-builder --win nsis --publish never --prepackaged $attemptSource --config.directories.output=$attemptOutput 2>&1 | ForEach-Object {
              $line = [string]$_
              $attemptLogs.Add($line)
              Write-Host $line
            }
            $exitCode = $LASTEXITCODE

            if ($exitCode -eq 0) {
              $setupExe = Get-ChildItem -Path (Join-Path $attemptOutput 'QuickText-Setup-*.exe') -File -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($null -eq $setupExe) {
                $lastFailure = "installer-missing: no QuickText-Setup-*.exe in $attemptOutput"
                $escapedMissing = $lastFailure.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Host "::warning::Installer attempt $attempt succeeded but setup file was not found: $escapedMissing"
                Start-Sleep -Seconds (10 * $attempt)
                continue
              }

              Copy-Item -LiteralPath $setupExe.FullName -Destination 'dist' -Force
              Copy-Item -Path (Join-Path $attemptOutput 'QuickText-Setup-*.exe.blockmap') -Destination 'dist' -Force -ErrorAction SilentlyContinue
              $buildSucceeded = $true
              break
            }

            $tail = ($attemptLogs | Select-Object -Last 30) -join ' || '
            if (-not $tail) {
              $tail = "electron-builder exited with code $exitCode and no log output captured"
            }
            $lastFailure = $tail
            $escapedTail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::warning::Installer attempt $attempt failed (exit $exitCode): $escapedTail"

            Start-Sleep -Seconds (10 * $attempt)
          }

          if (-not $buildSucceeded) {
            throw "Installer build failed after $maxAttempts attempts. Last failure: $lastFailure"
          }

      - name: Build launcher zip + latest.json
        shell: pwsh
        run: |
          $baseUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/"
          & ./scripts/build-launcher-release.ps1 -BaseUrl $baseUrl

      - name: Build Kira LC custom setup
        shell: pwsh
        run: |
          & ./scripts/build-kira-lc-setup.ps1

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/KiraLC-Setup-*.exe
            dist/QuickText-Setup-*.exe
            dist/QuickText-win-x64.zip
            dist/latest.json
