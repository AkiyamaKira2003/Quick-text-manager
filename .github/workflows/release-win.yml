name: release-win

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Windows unpacked app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Unpacked build attempt $attempt/$maxAttempts"

            if (Test-Path -LiteralPath 'dist/win-unpacked') {
              Remove-Item -LiteralPath 'dist/win-unpacked' -Recurse -Force -ErrorAction SilentlyContinue
            }

            npm run dist:folder
            if ($LASTEXITCODE -eq 0) {
              break
            }

            if ($attempt -eq $maxAttempts) {
              throw "dist:folder failed after $maxAttempts attempts."
            }

            Start-Sleep -Seconds (10 * $attempt)
          }

      - name: Build Windows setup installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $maxAttempts = 3
          $buildSucceeded = $false
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Installer build attempt $attempt/$maxAttempts"
            $attemptOutput = "dist-installer-attempt-$attempt"

            if (Test-Path -LiteralPath $attemptOutput) {
              Remove-Item -LiteralPath $attemptOutput -Recurse -Force -ErrorAction SilentlyContinue
            }

            npx electron-builder --win nsis --prepackaged dist/win-unpacked --config.directories.output=$attemptOutput
            if ($LASTEXITCODE -eq 0) {
              Copy-Item -Path (Join-Path $attemptOutput 'QuickText-Setup-*.exe') -Destination 'dist' -Force
              Copy-Item -Path (Join-Path $attemptOutput 'QuickText-Setup-*.exe.blockmap') -Destination 'dist' -Force -ErrorAction SilentlyContinue
              $buildSucceeded = $true
              break
            }

            Start-Sleep -Seconds (10 * $attempt)
          }

          if (-not $buildSucceeded) {
            throw "Installer build failed after $maxAttempts attempts."
          }

      - name: Build launcher zip + latest.json
        shell: pwsh
        run: |
          $baseUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/"
          & ./scripts/build-launcher-release.ps1 -BaseUrl $baseUrl

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/QuickText-Setup-*.exe
            dist/QuickText-win-x64.zip
            dist/latest.json
